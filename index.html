<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Чатика</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700;900&family=Nunito:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <style>
        
        :root {
            --bg-deep: #130f1c;         
            --bg-sunset: #38255c;       
            --bg-velvet: #221836;       
            
            --mint-light: #d1fce0;      
            --mint-main: #5cf28a;       
            --mint-dark: #278c47;       
            
            --text-main: #f0edf5;       
            --text-muted: #b5adc4;      
            
            --font-title: 'Comfortaa', cursive;
            --font-text: 'Nunito', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
			background-color: #70e2a3;
            background-image: url('background.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        
        .portal-header {
            text-align: center;
            margin-bottom: 50px;
            margin-top: 50px; 
            animation: fadeInDown 0.4s ease forwards;
            
            
            background: rgba(19, 15, 28, 0.75); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            padding: 30px 60px;
            border-radius: 30px;
            border: 1px solid rgba(92, 242, 138, 0.2); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .portal-header h1 {
            font-family: var(--font-title);
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.6), 0 0 20px rgba(92, 242, 138, 0.4);
            margin-bottom: 15px;
        }

        .portal-header h1::before, .portal-header h1::after {
            content: '✨';
            display: inline-block;
            font-size: 34px;
            color: var(--mint-main);
            margin: 0 15px;
            filter: drop-shadow(0 0 10px var(--mint-main));
        }

        .portal-header p {
            font-size: 20px;
            color: var(--mint-light);
            font-weight: 600;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        
        .cards-wrapper {
            display: flex;
            gap: 50px;
            justify-content: center;
            align-items: stretch; 
            flex-wrap: wrap;
            max-width: 1200px;
            width: 100%;
            margin-bottom: 50px; 
        }

        .portal-card {
            display: flex; 
            flex-direction: column; 
            text-decoration: none;
            width: 420px;
            background: rgba(19, 15, 28, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--mint-dark);
            border-radius: 28px;
            padding: 10px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 20px rgba(92, 242, 138, 0.1);
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .portal-card:nth-child(1) { animation-delay: 0.1s; }
        .portal-card:nth-child(2) { animation-delay: 0.2s; }

        
        .portal-card::before {
            content: ''; position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px dashed rgba(92, 242, 138, 0.3);
            border-radius: 20px;
            pointer-events: none; z-index: 10;
            transition: all 0.4s ease;
        }

        .portal-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--mint-main);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 40px rgba(92, 242, 138, 0.3);
        }

        .portal-card:hover::before {
            border-color: rgba(92, 242, 138, 0.8);
        }

        .card-img-wrapper {
            width: 100%;
            height: 280px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            background: var(--bg-velvet);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 2px solid rgba(92, 242, 138, 0.2);
            flex-shrink: 0; 
        }

        
        .fallback-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            z-index: 1;
        }

        
        .card-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 2;
            transition: transform 0.7s ease, opacity 0.3s ease;
        }

        .portal-card:hover .card-img {
            transform: scale(1.08);
        }

        
        .card-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(19, 15, 28, 0.2);
            z-index: 3;
            transition: background 0.4s ease;
            pointer-events: none;
        }

        .portal-card:hover .card-overlay {
            background: rgba(92, 242, 138, 0.05);
        }

        .card-info {
            padding: 30px 20px 20px;
            text-align: center;
            position: relative;
            z-index: 4;
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }

        .card-title {
            font-family: var(--font-title);
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            transition: color 0.3s ease;
        }

        .portal-card:hover .card-title {
            color: var(--mint-light);
            text-shadow: 0 2px 10px rgba(92, 242, 138, 0.6);
        }

        .card-desc {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.5;
            font-weight: 600;
        }

        
        .help-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(19, 15, 28, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--mint-main);
            text-decoration: none;
            padding: 12px 35px;
            border-radius: 30px;
            border: 2px solid rgba(92, 242, 138, 0.3);
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 40px; 
            transition: all 0.3s ease;
            animation: fadeInUp 0.4s ease 0.3s forwards;
            opacity: 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }

        .help-btn:hover {
            background: var(--mint-main);
            color: var(--bg-deep);
            box-shadow: 0 0 20px rgba(92, 242, 138, 0.6);
            transform: translateY(-3px) scale(1.02);
            border-color: var(--mint-main);
        }

        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        
        @media (max-width: 900px) {
            .portal-header { padding: 20px 30px; } 
            .portal-header h1 { font-size: 38px; }
            .portal-card { width: 100%; max-width: 420px; }
            .cards-wrapper { flex-direction: column; gap: 30px; }
        }
    </style>
</head>
<body>

    <div class="portal-header">
        <h1>Для Чатика</h1>
        <p>Выбери хранилище, в которое хочешь заглянуть</p>
    </div>

    <div class="cards-wrapper">
        
        
        <a href="https://cherteya.github.io/games/" class="portal-card">
            <div class="card-img-wrapper">
                <div class="fallback-icon">🎮</div>
                <img src="games.png" alt="Игровой Архив" class="card-img" onerror="this.style.opacity='0'">
                <div class="card-overlay"></div>
            </div>
            <div class="card-info">
                <div>
                    <div class="card-title">Игровая</div>
                    <div class="card-desc">Список всех заказанных и пройденных игр</div>
                </div>
            </div>
        </a>

        
        <a href="https://cherteya.github.io/kino/" class="portal-card">
            <div class="card-img-wrapper">
                <div class="fallback-icon">🍿</div>
                <img src="movies.png" alt="Кино Архив" class="card-img" onerror="this.style.opacity='0'">
                <div class="card-overlay"></div>
            </div>
            <div class="card-info">
                <div>
                    <div class="card-title">Кино и Сериалы</div>
                    <div class="card-desc">Список всех заказанных и просмотренных фильмов</div>
                </div>
            </div>
        </a>

    </div>

    
    <a href="https://cherteya.github.io/help/" class="help-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        Инструкция
    </a>

</body>
</html>
